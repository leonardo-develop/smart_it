<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المساق - Smart IT Hub</title> <link rel="stylesheet" href="/managecourse/manag.css"> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <style>
        .warning-text {
            color: #e74c3c;
            font-weight: bold;
        }
       
        .midterm-input, .participation-input, .final-input {
            width: 60px;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            text-align: center;
        }
        .status-msg {
            font-size: 0.85em;
            margin-top: 8px;
            display: block;
        }
        .total-grade-cell {
            background-color: #f8f9fa;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <header class="page-header">
        <h1 id="courseTitle">تحميل اسم المساق...</h1> <p>رمز Mادة: <span id="displayCourseCode" style="font-weight: bold; color: #3498db;"></span></p> </header>

    <main class="container">
        <section class="students-management card">
            <h3>📊 قائمة الطلاب والتحضير</h3> <div class="table-responsive">
                <table id="studentsTable">
                    <thead>
                        <tr>
                            <th>اسم الطالب</th> <th>الرقم الجامعي</th> <th>الميد (30)</th> <th>المشاركة (20)</th> <th>الفاينل (50)</th> <th>عدد الغيابات</th> <th>النسبة %</th> <th>المجموع (100)</th> 
                            <th>تحضير اليوم</th> </tr>
                    </thead>
                    <tbody id="studentsBody">
                        </tbody>
                </table>
            </div>
        </section>

        <div class="actions">
            <button class="save-btn" onclick="saveAllData()">حفظ التعديلات والتحضير ✅</button> <button class="back-btn" onclick="window.location.href='/syllabus/syll.html'">العودة للمساقات</button> </div>
    </main>

    <script src="/managecourse/course_m.js"></script> </body>
</html>
